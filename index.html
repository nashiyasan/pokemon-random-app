<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダムポケモン図鑑</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 55%, #0f3460 100%);
      font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 40px;
    }

    header { text-align: center; margin-bottom: 24px; }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(to right, #ffd700, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 span { -webkit-text-fill-color: initial; }

    /* ── タイプフィルター ── */
    #type-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 720px;
      width: 100%;
      margin-bottom: 28px;
    }

    .type-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 2px solid transparent;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
      transition: all 0.2s;
      opacity: 0.6;
    }

    .type-btn:hover { opacity: 1; transform: scale(1.08); }
    .type-btn.active {
      opacity: 1;
      border-color: white;
      box-shadow: 0 0 14px rgba(255,255,255,0.45);
    }

    /* ── カード ── */
    #pokemon-card {
      width: 320px;
      max-width: 100%;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0,0,0,0.6);
      background: #fff;
      color: #333;
      transition: transform 0.3s;
    }

    #pokemon-card:hover { transform: translateY(-6px); }

    #card-header {
      padding: 20px 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      min-height: 220px;
      background: linear-gradient(135deg, #a8a87888, #a8a87833);
      transition: background 0.5s;
    }

    #pokemon-number {
      align-self: flex-start;
      font-size: 0.88rem;
      font-weight: 700;
      color: rgba(255,255,255,0.75);
      letter-spacing: 1px;
      min-height: 1.2em;
    }

    #spinner {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: rgba(255,255,255,0.9);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    #pokemon-sprite {
      width: 180px; height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.28));
      animation: fadeUp 0.4s ease;
      display: none;
    }

    /* ── カード本体 ── */
    #card-body {
      padding: 16px 22px 24px;
      visibility: hidden;
    }

    #pokemon-name-ja {
      font-size: 1.9rem;
      font-weight: 900;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 3px;
    }

    #pokemon-name-en {
      font-size: 0.82rem;
      color: #bbb;
      text-align: center;
      text-transform: capitalize;
      margin-bottom: 12px;
    }

    #pokemon-types {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .type-badge {
      padding: 4px 18px;
      border-radius: 14px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #pokemon-info {
      display: flex;
      justify-content: center;
      gap: 36px;
      margin-bottom: 16px;
      color: #999;
      font-size: 0.8rem;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .info-item strong {
      color: #444;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .stats-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ccc;
      margin-bottom: 8px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .stat-name {
      width: 58px;
      text-align: right;
      font-size: 0.72rem;
      color: #aaa;
    }

    .stat-value {
      width: 28px;
      text-align: right;
      font-size: 0.8rem;
      font-weight: 800;
      color: #555;
    }

    .stat-bar-bg {
      flex: 1;
      height: 7px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
    }

    .stat-bar {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.7s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── ランダムボタン ── */
    #random-btn {
      margin-top: 28px;
      padding: 15px 52px;
      font-size: 1.05rem;
      font-weight: 800;
      background: linear-gradient(135deg, #e63946, #c1121f);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(230,57,70,0.5);
      transition: all 0.2s;
      letter-spacing: 1.5px;
    }

    #random-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 8px 30px rgba(230,57,70,0.65);
    }

    #random-btn:active { transform: scale(0.97); }

    #random-btn:disabled {
      background: linear-gradient(135deg, #888, #666);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      margin-top: 11px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.35);
    }

    #error-msg {
      display: none;
      text-align: center;
      padding: 20px;
      color: #ff6b6b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <h1><span>⚡</span> ランダムポケモン図鑑</h1>
</header>

<div id="type-filters">
  <button class="type-btn active" data-type="all" style="background:#556;color:#fff;">すべて</button>
</div>

<div id="pokemon-card">
  <div id="card-header">
    <span id="pokemon-number"></span>
    <div id="spinner"></div>
    <img id="pokemon-sprite" alt="ポケモン">
  </div>
  <div id="card-body">
    <div id="pokemon-name-ja"></div>
    <div id="pokemon-name-en"></div>
    <div id="pokemon-types"></div>
    <div id="pokemon-info"></div>
    <div class="stats-label">基本ステータス</div>
    <div id="pokemon-stats"></div>
  </div>
  <div id="error-msg">データの取得に失敗しました。再試行してください。</div>
</div>

<button id="random-btn">ランダムに表示</button>
<p class="hint">スペースキーでも切り替えられます</p>

<script>
  const TYPE_DATA = {
    normal:   { ja: 'ノーマル',   color: '#A8A878' },
    fire:     { ja: 'ほのお',     color: '#F08030' },
    water:    { ja: 'みず',       color: '#6890F0' },
    electric: { ja: 'でんき',     color: '#F8D030' },
    grass:    { ja: 'くさ',       color: '#78C850' },
    ice:      { ja: 'こおり',     color: '#98D8D8' },
    fighting: { ja: 'かくとう',   color: '#C03028' },
    poison:   { ja: 'どく',       color: '#A040A0' },
    ground:   { ja: 'じめん',     color: '#E0C068' },
    flying:   { ja: 'ひこう',     color: '#A890F0' },
    psychic:  { ja: 'エスパー',   color: '#F85888' },
    bug:      { ja: 'むし',       color: '#A8B820' },
    rock:     { ja: 'いわ',       color: '#B8A038' },
    ghost:    { ja: 'ゴースト',   color: '#705898' },
    dragon:   { ja: 'ドラゴン',   color: '#7038F8' },
    dark:     { ja: 'あく',       color: '#705848' },
    steel:    { ja: 'はがね',     color: '#B8B8D0' },
    fairy:    { ja: 'フェアリー', color: '#EE99AC' },
  };

  const STAT_NAMES = {
    hp:               'HP',
    attack:           'こうげき',
    defense:          'ぼうぎょ',
    'special-attack': 'とくこう',
    'special-defense':'とくぼう',
    speed:            'すばやさ',
  };

  const STAT_COLORS = {
    hp:               '#FF5959',
    attack:           '#F5AC78',
    defense:          '#FAE078',
    'special-attack': '#9DB7F5',
    'special-defense':'#A7DB8D',
    speed:            '#FA92B2',
  };

  let currentType = 'all';
  let typeCache   = {};
  let isLoading   = false;

  function isLight(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return (r*299 + g*587 + b*114) / 1000 > 150;
  }

  function buildTypeFilters() {
    const container = document.getElementById('type-filters');
    for (const [name, data] of Object.entries(TYPE_DATA)) {
      const btn = document.createElement('button');
      btn.className = 'type-btn';
      btn.dataset.type = name;
      btn.textContent = data.ja;
      btn.style.background = data.color;
      btn.style.color = isLight(data.color) ? '#333' : '#fff';
      container.appendChild(btn);
    }
  }

  async function getRandomId() {
    if (currentType === 'all') {
      return Math.floor(Math.random() * 1025) + 1;
    }
    if (!typeCache[currentType]) {
      const res  = await fetch(`https://pokeapi.co/api/v2/type/${currentType}`);
      const data = await res.json();
      typeCache[currentType] = data.pokemon
        .map(p => parseInt(p.pokemon.url.split('/').slice(-2,-1)[0]))
        .filter(id => id >= 1 && id <= 1025);
    }
    const pool = typeCache[currentType];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function setLoading(on) {
    const spinner = document.getElementById('spinner');
    const sprite  = document.getElementById('pokemon-sprite');
    const body    = document.getElementById('card-body');
    const err     = document.getElementById('error-msg');
    if (on) {
      spinner.style.display = 'block';
      sprite.style.display  = 'none';
      body.style.visibility = 'hidden';
      err.style.display     = 'none';
    } else {
      spinner.style.display = 'none';
    }
  }

  async function showRandom() {
    if (isLoading) return;
    isLoading = true;
    document.getElementById('random-btn').disabled = true;
    setLoading(true);

    try {
      const id = await getRandomId();
      document.getElementById('pokemon-number').textContent = `#${String(id).padStart(3,'0')}`;

      const [pkRes, spRes] = await Promise.allSettled([
        fetch(`https://pokeapi.co/api/v2/pokemon/${id}`).then(r => r.json()),
        fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`).then(r => r.json()),
      ]);

      if (pkRes.status === 'rejected') throw new Error('pokemon fetch failed');
      const pk = pkRes.value;
      const sp = spRes.status === 'fulfilled' ? spRes.value : null;

      const jaName = sp
        ? (sp.names.find(n => n.language.name === 'ja-Hrkt')?.name
          || sp.names.find(n => n.language.name === 'ja')?.name
          || pk.name)
        : pk.name;

      const primaryType  = pk.types[0].type.name;
      const primaryColor = TYPE_DATA[primaryType]?.color || '#888';

      document.getElementById('card-header').style.background =
        `linear-gradient(135deg, ${primaryColor}bb, ${primaryColor}33)`;

      // ── スプライト ──
      const spriteUrl = pk.sprites.other?.['official-artwork']?.front_default
                     || pk.sprites.front_default;
      const sprite = document.getElementById('pokemon-sprite');
      sprite.onload = () => {
        setLoading(false);
        sprite.style.display = 'block';
        document.getElementById('card-body').style.visibility = 'visible';
        setTimeout(() => {
          document.querySelectorAll('.stat-bar').forEach(bar => {
            bar.style.width = bar.dataset.pct + '%';
          });
        }, 60);
      };
      sprite.onerror = () => {
        setLoading(false);
        document.getElementById('card-body').style.visibility = 'visible';
        setTimeout(() => {
          document.querySelectorAll('.stat-bar').forEach(bar => {
            bar.style.width = bar.dataset.pct + '%';
          });
        }, 60);
      };
      sprite.src = spriteUrl;

      // ── テキスト ──
      document.getElementById('pokemon-name-ja').textContent = jaName;
      document.getElementById('pokemon-name-en').textContent = pk.name;

      document.getElementById('pokemon-types').innerHTML = pk.types.map(t => {
        const ti = TYPE_DATA[t.type.name] || { ja: t.type.name, color: '#999' };
        return `<span class="type-badge" style="background:${ti.color};color:${isLight(ti.color)?'#333':'#fff'}">${ti.ja}</span>`;
      }).join('');

      document.getElementById('pokemon-info').innerHTML = `
        <div class="info-item"><span>おもさ</span><strong>${(pk.weight/10).toFixed(1)} kg</strong></div>
        <div class="info-item"><span>たかさ</span><strong>${(pk.height/10).toFixed(1)} m</strong></div>
      `;

      document.getElementById('pokemon-stats').innerHTML = pk.stats.map(s => {
        const color = STAT_COLORS[s.stat.name] || '#aaa';
        const pct   = Math.min(100, Math.round(s.base_stat / 255 * 100));
        return `
          <div class="stat-row">
            <span class="stat-name">${STAT_NAMES[s.stat.name] || s.stat.name}</span>
            <span class="stat-value">${s.base_stat}</span>
            <div class="stat-bar-bg">
              <div class="stat-bar" style="background:${color}" data-pct="${pct}"></div>
            </div>
          </div>`;
      }).join('');

    } catch (err) {
      console.error(err);
      setLoading(false);
      document.getElementById('error-msg').style.display = 'block';
    }

    isLoading = false;
    document.getElementById('random-btn').disabled = false;
  }

  // ── イベント ──
  document.getElementById('type-filters').addEventListener('click', e => {
    const btn = e.target.closest('.type-btn');
    if (!btn) return;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    showRandom();
  });

  document.getElementById('random-btn').addEventListener('click', showRandom);

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      showRandom();
    }
  });

  buildTypeFilters();
  showRandom();
</script>
</body>
</html>
