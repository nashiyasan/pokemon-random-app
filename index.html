<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダムポケモン図鑑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root { --tc: #888; --tc-r: 136; --tc-g: 136; --tc-b: 136; }

    body {
      min-height: 100vh;
      background: #0b0e17;
      font-family: 'Nunito', 'Noto Sans JP', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 52px;
      overflow-x: hidden;
    }

    /* ── 背景装飾 ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 15% 10%,  rgba(230,57,70,.13)  0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 90%,  rgba(80,112,200,.13) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    .bg-ball {
      position: fixed; pointer-events: none; z-index: 0;
      border-radius: 50%;
      border: 50px solid rgba(255,255,255,.018);
    }
    .bg-ball.b1 { width: 560px; height: 560px; bottom: -200px; right: -180px; }
    .bg-ball.b2 { width: 320px; height: 320px; top: -80px; left: -100px; border-width: 30px; border-color: rgba(255,255,255,.012); }

    /* ── ヘッダー ── */
    header { text-align: center; margin-bottom: 28px; position: relative; z-index: 1; }

    .logo-row {
      display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 5px;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      letter-spacing: 1px;
      background: linear-gradient(100deg, #FFD700 0%, #FFAA00 40%, #FF6B6B 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .subtitle {
      font-size: 0.72rem; color: rgba(255,255,255,.3);
      letter-spacing: 4px; text-transform: uppercase;
    }

    /* ── タイプフィルター ── */
    #type-filters {
      display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;
      max-width: 700px; width: 100%; margin-bottom: 30px; position: relative; z-index: 1;
    }

    .type-btn {
      padding: 6px 14px; border-radius: 20px; border: 1.5px solid transparent;
      cursor: pointer; font-size: 0.79rem; font-weight: 800;
      font-family: 'Nunito', sans-serif;
      transition: all .18s; opacity: .55; letter-spacing: .4px;
    }
    .type-btn:hover { opacity: 1; transform: scale(1.1) translateY(-2px); }
    .type-btn.active {
      opacity: 1; border-color: rgba(255,255,255,.85);
      box-shadow: 0 0 16px rgba(255,255,255,.25), inset 0 0 0 1px rgba(255,255,255,.2);
    }

    /* ── カード外枠 ── */
    #pokemon-card {
      width: 340px; max-width: 100%;
      border-radius: 26px; overflow: visible;
      position: relative; z-index: 1;
      transition: transform .3s;
      cursor: default;
    }

    #pokemon-card:hover { transform: translateY(-8px) scale(1.012); }

    /* グロー枠 */
    .card-glow {
      position: absolute; inset: -2px; border-radius: 28px;
      background: conic-gradient(
        var(--tc) 0%, rgba(var(--tc-r),var(--tc-g),var(--tc-b),.3) 40%,
        var(--tc) 70%, rgba(var(--tc-r),var(--tc-g),var(--tc-b),.3) 100%
      );
      z-index: -1;
      filter: blur(1px);
      box-shadow: 0 0 40px rgba(var(--tc-r),var(--tc-g),var(--tc-b),.55);
      transition: background .5s, box-shadow .5s;
    }

    /* カード本体 */
    .card-inner {
      border-radius: 24px; overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,.75);
    }

    /* ホログラムシマー */
    .card-shine {
      position: absolute; inset: 0; border-radius: 24px;
      background: radial-gradient(
        circle at var(--mx, 50%) var(--my, 50%),
        rgba(255,255,255,.13) 0%, transparent 55%
      );
      pointer-events: none; z-index: 20;
      transition: background .05s;
    }

    /* ── カードヘッダー ── */
    #card-header {
      position: relative; height: 230px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden;
      background: linear-gradient(150deg, var(--tc) 0%, rgba(10,12,20,.85) 100%);
      transition: background .5s;
    }

    /* ポケボール透かし */
    .pb-watermark {
      position: absolute; right: -80px; top: -80px;
      width: 320px; height: 320px;
      pointer-events: none; opacity: .12;
    }

    #pokemon-number {
      position: absolute; top: 13px; left: 16px;
      font-family: 'Fredoka One', cursive;
      font-size: .9rem; color: rgba(255,255,255,.7); letter-spacing: 1px;
    }

    #pokemon-rarity {
      position: absolute; top: 13px; right: 16px;
      font-size: .65rem; font-weight: 700; color: rgba(255,255,255,.45);
      letter-spacing: 2px; text-transform: uppercase;
    }

    /* スプライト */
    #sprite-wrap {
      position: relative; width: 190px; height: 190px;
      display: flex; align-items: center; justify-content: center;
    }

    .sprite-aura {
      position: absolute; inset: 15px; border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--tc-r),var(--tc-g),var(--tc-b),.55) 0%, transparent 70%);
      filter: blur(22px);
    }

    #pokemon-sprite {
      position: relative; z-index: 2;
      width: 180px; height: 180px; object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.6));
      display: none;
      animation: spriteIn .55s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes spriteIn {
      from { opacity: 0; transform: scale(.65) translateY(22px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }

    #spinner {
      position: absolute;
      width: 46px; height: 46px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: rgba(255,255,255,.85);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── カード本体 ── */
    #card-body {
      padding: 18px 22px 24px; visibility: hidden;
      background: linear-gradient(180deg, #1c1f2e 0%, #13151f 100%);
    }

    #pokemon-name-ja {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem; text-align: center; line-height: 1;
      margin-bottom: 3px; letter-spacing: 1px;
    }

    #pokemon-name-en {
      font-size: .8rem; color: rgba(255,255,255,.35);
      text-align: center; text-transform: capitalize;
      margin-bottom: 13px; letter-spacing: 1.2px;
    }

    #pokemon-types {
      display: flex; gap: 9px; justify-content: center; margin-bottom: 16px;
    }

    .type-badge {
      padding: 5px 22px; border-radius: 14px;
      font-size: .8rem; font-weight: 900; letter-spacing: .8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.4);
    }

    /* 身長・体重 */
    #pokemon-info {
      display: flex; margin-bottom: 18px;
      border-radius: 12px; overflow: hidden;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.07);
    }

    .info-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      padding: 10px 0; gap: 2px;
    }
    .info-item:not(:last-child) { border-right: 1px solid rgba(255,255,255,.07); }
    .info-label { font-size: .62rem; font-weight: 700; color: rgba(255,255,255,.35); text-transform: uppercase; letter-spacing: 1px; }
    .info-value { font-size: .95rem; font-weight: 900; color: rgba(255,255,255,.9); }

    /* 区切り線 */
    .divider { height: 1px; background: rgba(255,255,255,.06); margin: 0 0 14px; }

    /* セクションラベル */
    .sec-label {
      font-size: .6rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 2.5px; color: rgba(255,255,255,.28); margin-bottom: 10px;
    }

    /* レーダーチャート */
    #radar-wrap { display: flex; justify-content: center; margin-bottom: 4px; }

    /* シリーズ */
    #series-section { margin-top: 14px; }

    .first-gen-badge {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-radius: 12px;
      font-weight: 800; color: #fff;
      margin-bottom: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.35);
    }
    .fg-star { font-size: 1.1rem; }
    .fg-info { display: flex; flex-direction: column; gap: 1px; }
    .fg-name { font-size: .83rem; }
    .fg-games { font-size: .68rem; font-weight: 600; opacity: .8; }

    #pokemon-generations { display: flex; flex-wrap: wrap; gap: 5px; }
    .gen-badge {
      padding: 4px 11px; border-radius: 8px;
      font-size: .72rem; font-weight: 800; color: #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.3);
    }

    /* エラー */
    #error-msg { display:none; text-align:center; padding:20px; color:#ff6b6b; font-size:.9rem; }

    /* ── ランダムボタン ── */
    #btn-wrap { margin-top: 30px; display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; z-index: 1; }

    #random-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 15px 46px; font-size: 1.05rem; font-weight: 900;
      font-family: 'Nunito', sans-serif; letter-spacing: 1px;
      background: linear-gradient(135deg, #e63946 0%, #9d0c1e 100%);
      color: #fff; border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 4px 24px rgba(230,57,70,.45), 0 0 0 2px rgba(230,57,70,.25);
      transition: all .2s; position: relative; overflow: hidden;
    }
    #random-btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.18) 0%, transparent 50%);
      border-radius: 50px;
    }
    #random-btn:hover {
      transform: scale(1.06) translateY(-3px);
      box-shadow: 0 10px 34px rgba(230,57,70,.6), 0 0 0 2px rgba(230,57,70,.4);
    }
    #random-btn:active { transform: scale(.97); }
    #random-btn:disabled {
      background: linear-gradient(135deg, #3a3d4a, #252730);
      box-shadow: none; cursor: not-allowed; transform: none;
    }

    .hint { font-size: .68rem; color: rgba(255,255,255,.22); letter-spacing: 1px; }

    /* ── 検索ボックス ── */
    #search-wrap {
      position: relative; width: 340px; max-width: 100%;
      margin-bottom: 22px; z-index: 10;
    }

    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,.35); pointer-events: none; font-size: 1rem;
    }

    #search-input {
      width: 100%; padding: 12px 44px 12px 42px;
      background: rgba(255,255,255,.07);
      border: 1.5px solid rgba(255,255,255,.12);
      border-radius: 16px; color: #fff;
      font-family: 'Nunito', sans-serif; font-size: .93rem; font-weight: 700;
      outline: none; transition: all .2s;
    }
    #search-input::placeholder { color: rgba(255,255,255,.28); font-weight: 600; }
    #search-input:focus {
      border-color: var(--tc);
      background: rgba(255,255,255,.1);
      box-shadow: 0 0 0 3px rgba(var(--tc-r),var(--tc-g),var(--tc-b),.2);
    }
    #search-input.error {
      border-color: #e63946;
      box-shadow: 0 0 0 3px rgba(230,57,70,.2);
      animation: shake .35s ease;
    }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-6px)}
      75%{transform:translateX(6px)}
    }

    #search-clear {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.35); font-size: 1rem; padding: 4px 6px;
      border-radius: 50%; transition: all .15s; display: none;
      line-height: 1;
    }
    #search-clear:hover { color: #fff; background: rgba(255,255,255,.1); }

    #search-dropdown {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: #1c1f2e; border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 16px 48px rgba(0,0,0,.6);
      max-height: 240px; overflow-y: auto; display: none; z-index: 100;
    }
    #search-dropdown::-webkit-scrollbar { width: 4px; }
    #search-dropdown::-webkit-scrollbar-track { background: transparent; }
    #search-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }

    .dd-item {
      padding: 10px 16px; cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      transition: background .12s; border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .dd-item:last-child { border-bottom: none; }
    .dd-item:hover, .dd-item.focused { background: rgba(255,255,255,.07); }

    .dd-num {
      font-size: .72rem; font-weight: 700; color: rgba(255,255,255,.3);
      min-width: 36px; font-family: 'Fredoka One', cursive; flex-shrink: 0;
    }
    .dd-names { display: flex; flex-direction: column; gap: 1px; }
    .dd-ja  { font-size: .9rem;  font-weight: 800; color: rgba(255,255,255,.9); }
    .dd-en  { font-size: .7rem;  font-weight: 600; color: rgba(255,255,255,.3); text-transform: capitalize; }
    .dd-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .dd-empty {
      padding: 16px; text-align: center;
      font-size: .82rem; color: rgba(255,255,255,.3); font-weight: 600;
    }
  </style>
</head>
<body>

<!-- 背景ボール -->
<div class="bg-ball b1"></div>
<div class="bg-ball b2"></div>

<header>
  <div class="logo-row">
    <!-- ポケボールアイコン -->
    <svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="clip-top"><rect x="0" y="0" width="100" height="50"/></clipPath>
        <clipPath id="clip-bot"><rect x="0" y="50" width="100" height="50"/></clipPath>
      </defs>
      <circle cx="50" cy="50" r="45" fill="#e63946" clip-path="url(#clip-top)"/>
      <circle cx="50" cy="50" r="45" fill="#fff" clip-path="url(#clip-bot)"/>
      <circle cx="50" cy="50" r="45" fill="none" stroke="#222" stroke-width="5"/>
      <line x1="5" y1="50" x2="95" y2="50" stroke="#222" stroke-width="5"/>
      <circle cx="50" cy="50" r="14" fill="#fff" stroke="#222" stroke-width="5"/>
      <circle cx="50" cy="50" r="7" fill="#ddd"/>
    </svg>
    <h1>ポケモン図鑑</h1>
  </div>
  <p class="subtitle">Random Pokémon Explorer</p>
</header>

<div id="search-wrap">
  <span class="search-icon">🔍</span>
  <input id="search-input" type="text"
         placeholder="ポケモン名（例：ピカチュウ、25）" autocomplete="off" spellcheck="false">
  <button id="search-clear">✕</button>
  <div id="search-dropdown"></div>
</div>

<div id="type-filters">
  <button class="type-btn active" data-type="all" style="background:#3a3d52;color:#fff;">すべて</button>
</div>

<div id="pokemon-card">
  <div class="card-glow"></div>
  <div class="card-inner">
    <!-- ヘッダー -->
    <div id="card-header">
      <!-- ポケボール透かし -->
      <svg class="pb-watermark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="wm-top"><rect x="0" y="0" width="100" height="50"/></clipPath>
          <clipPath id="wm-bot"><rect x="0" y="50" width="100" height="50"/></clipPath>
        </defs>
        <circle cx="50" cy="50" r="48" fill="white" clip-path="url(#wm-top)"/>
        <circle cx="50" cy="50" r="48" fill="rgba(255,255,255,.4)" clip-path="url(#wm-bot)"/>
        <circle cx="50" cy="50" r="48" fill="none" stroke="white" stroke-width="4"/>
        <line x1="2" y1="50" x2="98" y2="50" stroke="white" stroke-width="4"/>
        <circle cx="50" cy="50" r="14" fill="rgba(255,255,255,.6)" stroke="white" stroke-width="4"/>
        <circle cx="50" cy="50" r="7" fill="rgba(255,255,255,.8)"/>
      </svg>

      <span id="pokemon-number"></span>
      <span id="pokemon-rarity">Pokémon</span>

      <div id="sprite-wrap">
        <div class="sprite-aura"></div>
        <div id="spinner"></div>
        <img id="pokemon-sprite" alt="ポケモン">
      </div>
    </div>

    <!-- ボディ -->
    <div id="card-body">
      <div id="pokemon-name-ja"></div>
      <div id="pokemon-name-en"></div>
      <div id="pokemon-types"></div>
      <div id="pokemon-info"></div>

      <div class="divider"></div>
      <p class="sec-label">基本ステータス</p>
      <div id="radar-wrap"></div>

      <div class="divider"></div>
      <p class="sec-label">初登場・登場シリーズ</p>
      <div id="series-section"></div>
    </div>
    <div id="error-msg">データの取得に失敗しました。再試行してください。</div>
  </div>
  <div class="card-shine"></div>
</div>

<div id="btn-wrap">
  <button id="random-btn">
    <svg width="22" height="22" viewBox="0 0 100 100">
      <defs>
        <clipPath id="btn-top"><rect x="0" y="0" width="100" height="50"/></clipPath>
        <clipPath id="btn-bot"><rect x="0" y="50" width="100" height="50"/></clipPath>
      </defs>
      <circle cx="50" cy="50" r="44" fill="rgba(255,255,255,.35)" clip-path="url(#btn-top)"/>
      <circle cx="50" cy="50" r="44" fill="rgba(255,255,255,.15)" clip-path="url(#btn-bot)"/>
      <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="6"/>
      <line x1="6" y1="50" x2="94" y2="50" stroke="rgba(255,255,255,.75)" stroke-width="6"/>
      <circle cx="50" cy="50" r="14" fill="rgba(255,255,255,.25)" stroke="rgba(255,255,255,.75)" stroke-width="6"/>
    </svg>
    ランダムに表示
  </button>
  <p class="hint">Space キーでも切り替えられます</p>
</div>

<script>
  /* ═══ データ定義 ═══ */
  const TYPE_DATA = {
    normal:   { ja:'ノーマル',   color:'#9A9A78' },
    fire:     { ja:'ほのお',     color:'#F08030' },
    water:    { ja:'みず',       color:'#6890F0' },
    electric: { ja:'でんき',     color:'#F8D030' },
    grass:    { ja:'くさ',       color:'#78C850' },
    ice:      { ja:'こおり',     color:'#64C8C8' },
    fighting: { ja:'かくとう',   color:'#C03028' },
    poison:   { ja:'どく',       color:'#A040A0' },
    ground:   { ja:'じめん',     color:'#D8A820' },
    flying:   { ja:'ひこう',     color:'#A890F0' },
    psychic:  { ja:'エスパー',   color:'#F85888' },
    bug:      { ja:'むし',       color:'#90A820' },
    rock:     { ja:'いわ',       color:'#B8A038' },
    ghost:    { ja:'ゴースト',   color:'#705898' },
    dragon:   { ja:'ドラゴン',   color:'#7038F8' },
    dark:     { ja:'あく',       color:'#504838' },
    steel:    { ja:'はがね',     color:'#9898B0' },
    fairy:    { ja:'フェアリー', color:'#EE80A8' },
  };

  const STAT_ORDER  = ['hp','attack','defense','special-attack','special-defense','speed'];
  const STAT_LABELS = ['HP','攻撃','防御','特攻','特防','素早'];

  const GEN_ROMAN = { i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9 };

  const VERSION_TO_GEN = {
    'red':1,'blue':1,'yellow':1,
    'gold':2,'silver':2,'crystal':2,
    'ruby':3,'sapphire':3,'firered':3,'leafgreen':3,'emerald':3,
    'diamond':4,'pearl':4,'platinum':4,'heartgold':4,'soulsilver':4,
    'black':5,'white':5,'black-2':5,'white-2':5,
    'x':6,'y':6,'omegaruby':6,'alphasapphire':6,
    'sun':7,'moon':7,'ultra-sun':7,'ultra-moon':7,'lets-go-pikachu':7,'lets-go-eevee':7,
    'sword':8,'shield':8,'brilliant-diamond':8,'shining-pearl':8,'legends-arceus':8,
    'scarlet':9,'violet':9,
  };

  const GEN_INFO = {
    1:{name:'第1世代',games:'赤・緑・青・ピカチュウ版',color:'#C84040'},
    2:{name:'第2世代',games:'金・銀・クリスタル版',    color:'#A08820'},
    3:{name:'第3世代',games:'RS・エメラルド・FR/LG',  color:'#E07030'},
    4:{name:'第4世代',games:'DP・プラチナ・HG/SS',    color:'#4060B8'},
    5:{name:'第5世代',games:'BW・BW2',                color:'#505058'},
    6:{name:'第6世代',games:'X・Y・OR/AS',            color:'#3878C0'},
    7:{name:'第7世代',games:"SM・US/UM・Let's Go",    color:'#D07820'},
    8:{name:'第8世代',games:'SW/SH・BDSP・レジェンズ',color:'#6030C0'},
    9:{name:'第9世代',games:'スカーレット・バイオレット',color:'#B02868'},
  };

  /* ═══ ユーティリティ ═══ */
  function isLight(hex) {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return (r*299+g*587+b*114)/1000 > 150;
  }

  function hexToRgb(hex) {
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  }

  function setTypeColor(hex) {
    const [r,g,b] = hexToRgb(hex);
    document.documentElement.style.setProperty('--tc', hex);
    document.documentElement.style.setProperty('--tc-r', r);
    document.documentElement.style.setProperty('--tc-g', g);
    document.documentElement.style.setProperty('--tc-b', b);
  }

  /* ═══ レーダーチャート ═══ */
  function buildRadar(stats, color) {
    const C = 100, R = 62, LR = 84, N = 6;
    const ang = i => (i/N) * Math.PI*2 - Math.PI/2;
    const pt  = (i, r) => ({ x: C + r*Math.cos(ang(i)), y: C + r*Math.sin(ang(i)) });

    const values = STAT_ORDER.map(n => (stats.find(s=>s.stat.name===n)?.base_stat ?? 0));

    /* グリッド */
    const grid = [.25,.5,.75,1].map(lv => {
      const pts = Array.from({length:N},(_,i)=>{const p=pt(i,R*lv);return `${p.x},${p.y}`;}).join(' ');
      return `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;
    }).join('');

    /* 軸 */
    const axes = Array.from({length:N},(_,i)=>{
      const p=pt(i,R);
      return `<line x1="${C}" y1="${C}" x2="${p.x}" y2="${p.y}" stroke="rgba(255,255,255,.09)" stroke-width="1"/>`;
    }).join('');

    /* ステータスポリゴン */
    const spts = values.map((v,i)=>{
      const r = R * Math.min(1, v/180);
      const p = pt(i,r);
      return `${p.x},${p.y}`;
    }).join(' ');

    /* 頂点ドット */
    const dots = values.map((v,i)=>{
      const r = R * Math.min(1, v/180);
      const p = pt(i,r);
      return `<circle cx="${p.x}" cy="${p.y}" r="3" fill="${color}"/>`;
    }).join('');

    /* ラベル */
    const lbls = STAT_LABELS.map((lbl,i)=>{
      const a = ang(i);
      const cos = Math.cos(a), sin = Math.sin(a);
      const lp = { x: C + LR*cos, y: C + LR*sin };
      const anchor = cos < -.3 ? 'end' : cos > .3 ? 'start' : 'middle';
      let ny, vy;
      if (sin < -.6)     { ny = lp.y-1;  vy = lp.y+12; }
      else if (sin > .6) { ny = lp.y-11; vy = lp.y+1;  }
      else               { ny = lp.y-6;  vy = lp.y+7;  }
      return `
        <text x="${lp.x}" y="${ny}" text-anchor="${anchor}" font-size="8.5"
              fill="rgba(255,255,255,.42)" font-family="Nunito" font-weight="700">${lbl}</text>
        <text x="${lp.x}" y="${vy}" text-anchor="${anchor}" font-size="11"
              fill="rgba(255,255,255,.88)" font-family="Nunito" font-weight="900">${values[i]}</text>`;
    }).join('');

    return `<svg viewBox="-20 -20 240 240" width="200" height="200">
      ${grid}${axes}
      <polygon points="${spts}" fill="${color}40" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
      ${dots}${lbls}
    </svg>`;
  }

  /* ═══ フィルター構築 ═══ */
  function buildTypeFilters() {
    const c = document.getElementById('type-filters');
    for (const [name, d] of Object.entries(TYPE_DATA)) {
      const btn = document.createElement('button');
      btn.className = 'type-btn';
      btn.dataset.type = name;
      btn.textContent = d.ja;
      btn.style.background = d.color;
      btn.style.color = isLight(d.color) ? '#333' : '#fff';
      c.appendChild(btn);
    }
  }

  /* ═══ ランダムID取得 ═══ */
  let typeCache = {};
  async function getRandomId() {
    if (currentType === 'all') return Math.floor(Math.random()*1025)+1;
    if (!typeCache[currentType]) {
      const res  = await fetch(`https://pokeapi.co/api/v2/type/${currentType}`);
      const data = await res.json();
      typeCache[currentType] = data.pokemon
        .map(p => parseInt(p.pokemon.url.split('/').slice(-2,-1)[0]))
        .filter(id => id >= 1 && id <= 1025);
    }
    const pool = typeCache[currentType];
    return pool[Math.floor(Math.random()*pool.length)];
  }

  /* ═══ ローディング制御 ═══ */
  function setLoading(on) {
    document.getElementById('spinner').style.display        = on ? 'block' : 'none';
    document.getElementById('pokemon-sprite').style.display = on ? 'none'  : 'block';
    if (on) {
      document.getElementById('card-body').style.visibility = 'hidden';
      document.getElementById('error-msg').style.display    = 'none';
    }
  }

  /* ═══ ポケモン表示（共通） ═══ */
  function displayPokemon(pk, sp) {
    const jaName = sp
      ? (sp.names.find(n=>n.language.name==='ja-Hrkt')?.name
        || sp.names.find(n=>n.language.name==='ja')?.name
        || pk.name)
      : pk.name;

    const primaryType  = pk.types[0].type.name;
    const primaryColor = TYPE_DATA[primaryType]?.color ?? '#888';

    setTypeColor(primaryColor);
    document.getElementById('card-header').style.background =
      `linear-gradient(150deg, ${primaryColor} 0%, rgba(10,12,20,.88) 100%)`;
    document.getElementById('pokemon-number').textContent = `#${String(pk.id).padStart(3,'0')}`;

    const spriteUrl = pk.sprites.other?.['official-artwork']?.front_default
                   || pk.sprites.front_default;
    const sprite = document.getElementById('pokemon-sprite');
    const reveal = () => {
      setLoading(false);
      document.getElementById('card-body').style.visibility = 'visible';
    };
    sprite.onload  = reveal;
    sprite.onerror = reveal;
    sprite.src = spriteUrl;

    document.getElementById('pokemon-name-ja').textContent = jaName;
    document.getElementById('pokemon-name-en').textContent = pk.name;

    document.getElementById('pokemon-types').innerHTML = pk.types.map(t => {
      const ti = TYPE_DATA[t.type.name] || {ja:t.type.name, color:'#888'};
      return `<span class="type-badge" style="background:${ti.color};color:${isLight(ti.color)?'#222':'#fff'}">${ti.ja}</span>`;
    }).join('');

    document.getElementById('pokemon-info').innerHTML = `
      <div class="info-item">
        <span class="info-label">たかさ</span>
        <span class="info-value">${(pk.height/10).toFixed(1)} m</span>
      </div>
      <div class="info-item">
        <span class="info-label">おもさ</span>
        <span class="info-value">${(pk.weight/10).toFixed(1)} kg</span>
      </div>
      <div class="info-item">
        <span class="info-label">世代</span>
        <span class="info-value">Gen ${sp ? GEN_ROMAN[sp.generation.name.replace('generation-','')] ?? '?' : '?'}</span>
      </div>`;

    document.getElementById('radar-wrap').innerHTML = buildRadar(pk.stats, primaryColor);

    const firstGenKey = sp?.generation?.name?.replace('generation-','');
    const firstGenNum = firstGenKey ? GEN_ROMAN[firstGenKey] : null;
    const appearedGens = [...new Set(
      pk.game_indices.map(gi => VERSION_TO_GEN[gi.version.name]).filter(Boolean)
    )].sort((a,b) => a-b);

    let seriesHtml = '';
    if (firstGenNum && GEN_INFO[firstGenNum]) {
      const gi = GEN_INFO[firstGenNum];
      seriesHtml += `<div class="first-gen-badge" style="background:${gi.color}">
        <span class="fg-star">★</span>
        <div class="fg-info">
          <span class="fg-name">初登場: ${gi.name}</span>
          <span class="fg-games">${gi.games}</span>
        </div>
      </div>`;
    }
    if (appearedGens.length) {
      seriesHtml += `<div id="pokemon-generations">${
        appearedGens.map(g => GEN_INFO[g]
          ? `<span class="gen-badge" style="background:${GEN_INFO[g].color}">${GEN_INFO[g].name}</span>`
          : '').join('')
      }</div>`;
    }
    document.getElementById('series-section').innerHTML = seriesHtml;
  }

  /* ═══ ランダム表示 ═══ */
  let currentType = 'all';
  let isLoading   = false;

  async function showRandom() {
    if (isLoading) return;
    isLoading = true;
    document.getElementById('random-btn').disabled = true;
    setLoading(true);
    try {
      const id = await getRandomId();
      const [pkRes, spRes] = await Promise.allSettled([
        fetch(`https://pokeapi.co/api/v2/pokemon/${id}`).then(r=>r.json()),
        fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`).then(r=>r.json()),
      ]);
      if (pkRes.status === 'rejected') throw new Error('fetch failed');
      displayPokemon(pkRes.value, spRes.status === 'fulfilled' ? spRes.value : null);
    } catch (e) {
      console.error(e);
      setLoading(false);
      document.getElementById('error-msg').style.display = 'block';
    }
    isLoading = false;
    document.getElementById('random-btn').disabled = false;
  }

  /* ═══ 検索機能 ═══ */
  let pokemonList  = null;   // { name, id }[]
  let jaNameMap    = null;   // jaName → id
  let jaIdMap      = null;   // id → jaName
  let ddFocusIndex = -1;

  function isJapanese(str) {
    return /[぀-ヿ一-鿿]/.test(str);
  }

  async function loadPokemonList() {
    if (pokemonList) return;
    const res  = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');
    const data = await res.json();
    pokemonList = data.results.map(p => ({
      name: p.name,
      id: parseInt(p.url.split('/').slice(-2,-1)[0]),
    }));
  }

  async function loadJapaneseNames() {
    if (jaNameMap) return;
    try {
      const res = await fetch('https://beta.pokeapi.co/graphql/v1beta', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: `{
          pokemon_v2_pokemonspeciesname(
            where: {language_id: {_eq: 11}},
            order_by: {pokemon_species_id: asc}
          ) { name pokemon_species_id }
        }` }),
      });
      const json = await res.json();
      jaNameMap = {};
      jaIdMap   = {};
      for (const { name, pokemon_species_id: id } of json.data.pokemon_v2_pokemonspeciesname) {
        if (id >= 1 && id <= 1025) {
          jaNameMap[name] = id;
          jaIdMap[id]     = name;
        }
      }
    } catch (e) {
      console.warn('Japanese names unavailable:', e);
      jaNameMap = {};
      jaIdMap   = {};
    }
  }

  function renderDropdown(items) {
    const dd = document.getElementById('search-dropdown');
    if (!items || items.length === 0) {
      dd.innerHTML = `<div class="dd-empty">見つかりませんでした</div>`;
      dd.style.display = 'block';
      return;
    }
    dd.innerHTML = items.map((p, i) => `
      <div class="dd-item" data-id="${p.id}" data-idx="${i}">
        <span class="dd-num">#${String(p.id).padStart(3,'0')}</span>
        <div class="dd-names">
          <span class="dd-ja">${p.jaName || p.name}</span>
          <span class="dd-en">${p.name}</span>
        </div>
      </div>`).join('');
    ddFocusIndex = -1;
    dd.style.display = 'block';
  }

  function closeDropdown() {
    document.getElementById('search-dropdown').style.display = 'none';
    ddFocusIndex = -1;
  }

  async function searchById(id) {
    if (isLoading) return;
    isLoading = true;
    document.getElementById('random-btn').disabled = true;
    setLoading(true);
    closeDropdown();
    document.getElementById('search-input').classList.remove('error');
    try {
      const [pkRes, spRes] = await Promise.allSettled([
        fetch(`https://pokeapi.co/api/v2/pokemon/${id}`).then(r => { if(!r.ok) throw new Error(); return r.json(); }),
        fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`).then(r => r.json()),
      ]);
      if (pkRes.status === 'rejected') throw new Error('not found');
      displayPokemon(pkRes.value, spRes.status === 'fulfilled' ? spRes.value : null);
    } catch (e) {
      const query = document.getElementById('search-input').value;
      setLoading(false);
      const input = document.getElementById('search-input');
      input.classList.add('error');
      setTimeout(() => input.classList.remove('error'), 800);
      document.getElementById('error-msg').textContent = `「${query}」は見つかりませんでした`;
      document.getElementById('error-msg').style.display = 'block';
    }
    isLoading = false;
    document.getElementById('random-btn').disabled = false;
  }

  async function searchByQuery(query) {
    const q = query.trim();
    if (!q) return;

    // 図鑑番号
    if (/^\d+$/.test(q)) { searchById(parseInt(q)); return; }

    // 日本語名
    if (isJapanese(q) && jaNameMap) {
      const id = jaNameMap[q];
      if (id) { searchById(id); return; }
      // 完全一致なければ部分一致の先頭を使う
      const hit = Object.entries(jaNameMap).find(([name]) => name.includes(q));
      if (hit) { searchById(hit[1]); return; }
    }

    // 英語名（フォールバック）
    if (isLoading) return;
    isLoading = true;
    document.getElementById('random-btn').disabled = true;
    setLoading(true);
    closeDropdown();
    document.getElementById('search-input').classList.remove('error');
    try {
      const pkRes = await fetch(`https://pokeapi.co/api/v2/pokemon/${q.toLowerCase()}`);
      if (!pkRes.ok) throw new Error('not found');
      const pk = await pkRes.json();
      const sp = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${pk.id}`)
        .then(r => r.json()).catch(() => null);
      displayPokemon(pk, sp);
    } catch (e) {
      setLoading(false);
      const input = document.getElementById('search-input');
      input.classList.add('error');
      setTimeout(() => input.classList.remove('error'), 800);
      document.getElementById('error-msg').textContent = `「${q}」は見つかりませんでした`;
      document.getElementById('error-msg').style.display = 'block';
    }
    isLoading = false;
    document.getElementById('random-btn').disabled = false;
  }

  /* 検索イベント */
  const searchInput = document.getElementById('search-input');

  searchInput.addEventListener('focus', () => {
    Promise.all([loadPokemonList(), loadJapaneseNames()]);
  });

  searchInput.addEventListener('input', e => {
    const val = e.target.value.trim();
    document.getElementById('search-clear').style.display = val ? 'block' : 'none';
    if (!val) { closeDropdown(); return; }

    if (isJapanese(val)) {
      if (!jaNameMap) return;
      const hits = Object.entries(jaNameMap)
        .filter(([name]) => name.includes(val))
        .sort(([,a],[,b]) => a - b)
        .slice(0, 9)
        .map(([jaName, id]) => ({
          id, jaName,
          name: pokemonList?.find(p => p.id === id)?.name ?? String(id),
        }));
      renderDropdown(hits.length ? hits : []);
    } else {
      if (!pokemonList) return;
      const q = val.toLowerCase();
      const hits = pokemonList
        .filter(p => p.name.includes(q) || String(p.id).startsWith(q))
        .slice(0, 9)
        .map(p => ({ id: p.id, name: p.name, jaName: jaIdMap?.[p.id] ?? '' }));
      renderDropdown(hits.length ? hits : []);
    }
  });

  searchInput.addEventListener('keydown', e => {
    const dd    = document.getElementById('search-dropdown');
    const items = dd.querySelectorAll('.dd-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      ddFocusIndex = Math.min(ddFocusIndex + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('focused', i === ddFocusIndex));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      ddFocusIndex = Math.max(ddFocusIndex - 1, -1);
      items.forEach((el, i) => el.classList.toggle('focused', i === ddFocusIndex));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (ddFocusIndex >= 0 && items[ddFocusIndex]) {
        const id = parseInt(items[ddFocusIndex].dataset.id);
        searchInput.value = jaIdMap?.[id] ?? pokemonList?.find(p=>p.id===id)?.name ?? String(id);
        searchById(id);
      } else if (val.trim()) {
        searchByQuery(val.trim());
      }
    } else if (e.key === 'Escape') {
      closeDropdown();
    }
  });

  document.getElementById('search-dropdown').addEventListener('click', e => {
    const item = e.target.closest('.dd-item');
    if (!item) return;
    const id = parseInt(item.dataset.id);
    searchInput.value = jaIdMap?.[id] ?? pokemonList?.find(p=>p.id===id)?.name ?? String(id);
    document.getElementById('search-clear').style.display = 'block';
    searchById(id);
  });

  document.getElementById('search-clear').addEventListener('click', () => {
    searchInput.value = '';
    document.getElementById('search-clear').style.display = 'none';
    closeDropdown();
    searchInput.focus();
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#search-wrap')) closeDropdown();
  });

  /* ═══ ホログラムシマー ═══ */
  document.getElementById('pokemon-card').addEventListener('mousemove', e => {
    const r = e.currentTarget.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width  * 100).toFixed(1);
    const y = ((e.clientY - r.top)  / r.height * 100).toFixed(1);
    e.currentTarget.style.setProperty('--mx', x+'%');
    e.currentTarget.style.setProperty('--my', y+'%');
  });

  /* ═══ その他イベント ═══ */
  document.getElementById('type-filters').addEventListener('click', e => {
    const btn = e.target.closest('.type-btn');
    if (!btn) return;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    showRandom();
  });

  document.getElementById('random-btn').addEventListener('click', showRandom);

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
      e.preventDefault(); showRandom();
    }
  });

  buildTypeFilters();
  showRandom();
</script>
</body>
</html>
